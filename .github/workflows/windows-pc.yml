name: Windows PC (Tailscale + RDP)

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Nombre de la PC en Tailscale"
        default: "gh-windows-pc"
      auto_restart:
        description: "Relanzar automáticamente al terminar las ~6h (el disco se reinicia)"
        type: boolean
        default: false
      install_tools:
        description: "Instalar herramientas extra (Chrome, VS Code, Git, 7zip, Python, Node)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # necesario solo para auto_restart

jobs:
  pc:
    # Repo PÚBLICO: windows-latest = 4 vCPU / 16 GB RAM / 14 GB SSD (gratis)
    # Repo PRIVADO gratis: 2 vCPU / 7 GB RAM.
    # Si tienes plan de pago con "larger runners", cambia por tu etiqueta, ej: windows-2022-64core
    runs-on: windows-latest
    timeout-minutes: 360   # límite máximo de GitHub por job

    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ inputs.hostname }}

      - name: Activar Escritorio Remoto (RDP) y fijar contraseña
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) { throw "Falta el secret RDP_PASSWORD" }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Permitir RDP también por la interfaz de Tailscale
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue
          net user runneradmin "$env:RDP_PASSWORD"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

      - name: Herramientas extra
        if: ${{ inputs.install_tools }}
        shell: pwsh
        run: |
          choco install -y --no-progress googlechrome vscode git 7zip python nodejs-lts

      - name: Mostrar datos de conexión
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = & $ts ip -4
          Write-Host "=============================================="
          Write-Host " IP Tailscale : $ip"
          Write-Host " Usuario      : runneradmin"
          Write-Host " Contraseña   : (tu secret RDP_PASSWORD)"
          Write-Host " Conecta con Windows App -> Add PC -> $ip"
          Write-Host "=============================================="
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, @{n='RAM_GB';e={[math]::Round($_.TotalPhysicalMemory/1GB,1)}}

      - name: Mantener la PC encendida
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $end) {
            if (Test-Path "$env:USERPROFILE\stop.txt") { Write-Host "stop.txt encontrado, apagando."; break }
            Start-Sleep -Seconds 30
          }

      - name: Relanzar (opcional)
        if: ${{ inputs.auto_restart }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" -f hostname="${{ inputs.hostname }}" -f auto_restart=true -f install_tools=${{ inputs.install_tools }}
